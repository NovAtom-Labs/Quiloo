schema_version: "1.0"
name: pn-junction-reference
dimension: 1
regions:
  - id: p_region
    material: silicon
    x0: 0 um
    x1: 0.5 um
    mesh_spacing: 0.01 um
  - id: n_region
    material: silicon
    x0: 0.5 um
    x1: 1 um
    mesh_spacing: 0.01 um
profiles:
  - kind: constant
    region: p_region
    species: acceptor
    value: 1e17 cm^-3
  - kind: constant
    region: n_region
    species: donor
    value: 1e16 cm^-3
contacts:
  - id: anode
    location: x_min
    kind: ohmic
  - id: cathode
    location: x_max
    kind: ohmic
physics:
  equations: [poisson, electron_continuity, hole_continuity]
  models: [boltzmann, constant_mobility, srh]
  temperature: 300 K
study:
  kind: dc
  contact: anode
  start: 0 V
  stop: 0.2 V
  step: 0.1 V
observables: [terminal_current, potential, electron_density, hole_density]
metadata:
  purpose: reference fixture, not a privileged device mode

