schema_version: "1.0"
name: al-pn-al-equilibrium
dimension: 1
regions:
  - id: p_region
    material: silicon
    x0: 0 um
    x1: 1 um
    mesh_spacing: 0.02 um
  - id: n_region
    material: silicon
    x0: 1 um
    x1: 2 um
    mesh_spacing: 0.02 um
profiles:
  - kind: constant
    region: p_region
    species: acceptor
    value: 1e17 cm^-3
  - kind: constant
    region: n_region
    species: donor
    value: 1e17 cm^-3
contacts:
  - id: anode
    location: x_min
    kind: metal_work_function
    work_function: 4.10 eV
  - id: cathode
    location: x_max
    kind: metal_work_function
    work_function: 4.10 eV
physics:
  equations: [poisson, electron_continuity, hole_continuity]
  models: [fermi, constant_mobility, srh, auger, band_gap_narrowing]
  temperature: 300 K
study:
  kind: equilibrium
observables:
  - terminal_current
  - terminal_charge
  - potential
  - electric_field
  - electron_density
  - hole_density
  - charge_density
  - conduction_band
  - valence_band
  - fermi_level
  - electron_current_density
  - hole_current_density
  - electron_mobility
  - hole_mobility
  - recombination_rate
metadata:
  purpose: full Sentaurus pilot acceptance case
