schema_version: "1.0"
name: al-pn-al-equilibrium-devsim-approximation
dimension: 1
regions:
  - id: p_region
    material: silicon
    x0: 0 um
    x1: 1 um
    mesh_spacing: 0.02 um
  - id: n_region
    material: silicon
    x0: 1 um
    x1: 2 um
    mesh_spacing: 0.02 um
profiles:
  - kind: constant
    region: p_region
    species: acceptor
    value: 1e17 cm^-3
  - kind: constant
    region: n_region
    species: donor
    value: 1e17 cm^-3
contacts:
  - id: anode
    location: x_min
    kind: ohmic
  - id: cathode
    location: x_max
    kind: ohmic
physics:
  equations: [poisson, electron_continuity, hole_continuity]
  models: [boltzmann, constant_mobility, srh]
  temperature: 300 K
study:
  kind: equilibrium
observables: [terminal_current, potential, electric_field, electron_density, hole_density]
metadata:
  portability: explicit local approximation
  limitation: DEVSIM does not represent the requested aluminum work function, Fermi statistics, Auger, or band-gap narrowing in the current reviewed adapter
