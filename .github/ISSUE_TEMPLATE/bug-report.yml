name: Bug report
description: Report a reproducible Agent Kronig application or scientific workflow defect
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private repository data, proprietary simulator material, licensed logs, or security vulnerabilities. Follow SECURITY.md for private reporting.
  - type: input
    id: version
    attributes:
      label: Agent Kronig version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86-64
        - Apple Silicon arm64
        - Other
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package
      description: AppImage, deb, NSIS installer, ZIP, DMG, or source development
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence using non-sensitive sample data.
      placeholder: |
        1. Open...
        2. Select...
        3. Run...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove credentials, private paths, research data, proprietary inputs, and licensed output before pasting logs.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private research data, proprietary simulator content, and licensed logs.
          required: true
        - label: This report does not describe a security vulnerability.
          required: true
