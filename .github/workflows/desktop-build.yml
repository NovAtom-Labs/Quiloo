name: Agent Kronig native alpha

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate version and tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python scripts/release_contract.py --root . --tag "${GITHUB_REF_NAME}"
          else
            python scripts/release_contract.py --root .
          fi

  build:
    name: ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
          - name: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
          - name: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
          - name: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64

    runs-on: ${{ matrix.runner }}
    env:
      OPENHANDS_SUPPRESS_BANNER: "1"
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MAC_CSC_LINK || secrets.DESKTOP_WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MAC_CSC_KEY_PASSWORD || secrets.DESKTOP_WINDOWS_CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ ((matrix.platform == 'mac' && secrets.DESKTOP_MAC_CSC_LINK != '') || (matrix.platform == 'win' && secrets.DESKTOP_WINDOWS_CSC_LINK != '')) && 'true' || 'false' }}
      DESKTOP_LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_LINUX_SIGNING_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Python application and build tools
        run: python -m pip install --upgrade pip "pyinstaller==6.16.0" "devsim==2.9.1" -e ".[agent,knowledge,dev]"

      - name: Build reviewed knowledge index
        run: tcad-agent knowledge build --manifest knowledge-sources/manifests/sources.yaml --root . --index knowledge-sources/index/knowledge.sqlite3

      - name: Verify Python application
        run: pytest -q

      - name: Install locked desktop dependencies
        run: pnpm --dir desktop install --frozen-lockfile

      - name: Verify desktop shell
        run: pnpm --dir desktop test

      - name: Build target-native Python sidecars
        run: python scripts/build_desktop_sidecars.py

      - name: Scan unpacked sidecars for application credentials
        run: python scripts/inspect_desktop_artifacts.py desktop/resources/${{ matrix.platform == 'win' && 'win' || matrix.platform }}-${{ matrix.arch }}

      - name: Build native installers
        run: pnpm --dir desktop exec electron-builder --config electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }}

      - name: Sign Linux update artifact
        if: matrix.platform == 'linux'
        run: python scripts/sign_linux_updates.py desktop/dist

      - name: Inventory artifacts and reject embedded credentials
        run: python scripts/inspect_desktop_artifacts.py desktop/dist

      - name: Stage public release packages
        run: python scripts/release_artifacts.py stage desktop/dist desktop/release-stage "${{ matrix.platform }}" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-kronig-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/release-stage/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: agent-kronig-*
          path: release-downloads

      - name: Collect packages and checksums
        run: python scripts/release_artifacts.py collect release-downloads release-assets

      - name: Publish Agent Kronig alpha
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "Agent Kronig 0.1.0 Alpha 1" \
            --notes-file docs/releases/v0.1.0-alpha.1.md \
            --prerelease \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
